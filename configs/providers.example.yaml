# Provider templates. No secrets.

nous_portal:
  setup: "hermes setup --portal"
  status: "hermes portal status"
  oauth_store: "~/.hermes/auth.json"   # do not copy this file between machines
  notes: |
    Preferred inference for the lab agent and, via proxy, for external tools.

subscription_proxy:
  command: "hermes proxy start --provider nous --host 127.0.0.1 --port 8645"
  listen: "127.0.0.1:8645"
  openai_base_url: "http://127.0.0.1:8645/v1"
  openai_api_key: "any-nonempty-string"   # proxy attaches real OAuth upstream
  bind: loopback-only
  status: "hermes proxy status"

openrouter_optional:
  enabled: false
  endpoint: "https://openrouter.ai/api/v1/chat/completions"
  key_env: "OPENROUTER_API_KEY"
  notes: |
    Optional second provider. Origin used REDTEAM_API_KEY for attacker/judge.
    Do not make OpenRouter the only path if Nous subscription is the plan.

local_openai_compat:
  endpoint: "http://127.0.0.1:8000/v1/chat/completions"
  key_env: "LOCAL_MODEL_API_KEY"
  notes: "vLLM / llama.cpp / ollama-proxy as TARGET, not as attacker by default."

custom_http:
  endpoint: "${CUSTOM_BASE_URL}"
  api_mode: "openai"   # or anthropic_messages
  key_env: "${CUSTOM_API_KEY_ENV}"
